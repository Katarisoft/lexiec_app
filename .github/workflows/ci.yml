name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  calidad:
    name: Formato, análisis y pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Análisis estático
        run: flutter analyze

      - name: Pruebas
        run: flutter test

      - name: Auditoría de secretos
        run: |
          # Valores literales (sin espacios) asignados a nombres sensibles, o claves con formato conocido.
          # El nombre debe empezar en límite de palabra (evita "cambiarClave") y el valor no lleva
          # espacios (evita textos de interfaz como 'Mostrar clave').
          if git grep -nIiE "(^|[^A-Za-z])(api[_-]?key|secret|password|clave|token)['\"]?[[:space:]]*[:=][[:space:]]*['\"][^'\"[:space:]]{8,}['\"]|sk-[A-Za-z0-9]{10,}|AIza[0-9A-Za-z_-]{20,}" -- lib; then
            echo "::error::Posible secreto en el código"; exit 1
          fi
          if git ls-files | grep -E "(^|/)\.env$"; then
            echo "::error::.env no debe versionarse"; exit 1
          fi
