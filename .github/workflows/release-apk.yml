name: Release APK

# Se ejecuta al subir una etiqueta de versión:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # crear el Release y adjuntar el APK

jobs:
  apk:
    name: Compilar y publicar el APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # URL del backend de producción (no es un secreto).
      API_BASE_URL: https://lexiec.katarisoft.com/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Análisis y pruebas (no se publica un APK que no las pase)
        run: |
          flutter analyze
          flutter test

      # Firma propia opcional: definir en Settings → Secrets → Actions
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # Sin estos secrets se firma con la clave de depuración (instalable en emulador, no publicable).
      - name: Preparar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/lexiec-release.jks
            {
              echo "storeFile=lexiec-release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "Firma: keystore propio"
          else
            echo "::warning::Sin keystore en secrets: el APK se firma con la clave de depuración"
          fi

      - name: Compilar APK de Release
        run: flutter build apk --release --dart-define=API_BASE_URL=$API_BASE_URL

      - name: Renombrar APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "lexiec-${GITHUB_REF_NAME}.apk"

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          name: LexiEC ${{ github.ref_name }}
          files: lexiec-${{ github.ref_name }}.apk
          generate_release_notes: true
          body: |
            APK de LexiEC para Android. Instalación: descargar `lexiec-${{ github.ref_name }}.apk`
            y abrirlo en el dispositivo o emulador (permitir instalar apps de origen desconocido).
            Backend: ${{ env.API_BASE_URL }}

      - name: Limpiar keystore
        if: always()
        run: rm -f android/app/lexiec-release.jks android/key.properties
